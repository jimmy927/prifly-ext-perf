<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Performance</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="bars.css" />
    <link rel="stylesheet" href="gpu.css" />
    <script>
      // Before the first paint: the window says light or dark in the query.
      if (new URLSearchParams(location.search).get("theme") === "dark") {
        document.documentElement.classList.add("dark");
      }
    </script>
  </head>
  <body>
    <div class="app">
      <div class="bar">
        <h1>Performance</h1>
        <span class="grow"></span>
        <fieldset class="every" id="every" aria-label="Average over"></fieldset>
        <span class="status" id="status" aria-live="polite">Reading…</span>
      </div>
      <div class="tabs" role="tablist">
        <button type="button" class="tab" role="tab" data-tab="machine">Machine</button>
        <button type="button" class="tab" role="tab" data-tab="prifly">prifly</button>
      </div>
      <p class="error" id="error" hidden></p>

      <section id="machine">
        <div class="verdict" id="verdict"><span class="dot"></span><span id="headline"></span></div>
        <div class="hosts" id="hosts"></div>
        <div class="sub">What uses the CPU now</div>
        <div class="card">
          <table>
            <thead>
              <tr>
                <th>Where</th>
                <th>What</th>
                <th class="r">CPU</th>
                <th class="r">Memory</th>
                <th class="r">Disk</th>
              </tr>
            </thead>
            <tbody id="top"></tbody>
          </table>
        </div>
      </section>

      <section id="prifly" hidden>
        <p class="muted" id="prifly-absent" hidden></p>
        <div id="prifly-body">
          <div class="tiles" id="tiles"></div>
          <div class="sub subbar">
            <span>Split by</span>
            <fieldset class="every" id="splitby" aria-label="Split the bars by"></fieldset>
          </div>
          <div class="split">
            <div class="card" id="kinds"></div>
            <div class="card" id="mcp"></div>
          </div>
          <div class="sub">By session</div>
          <div class="card">
            <table>
              <thead>
                <tr>
                  <th>Session</th>
                  <th>State</th>
                  <th class="r">Processes</th>
                  <th class="r">CPU</th>
                  <th class="r">Memory</th>
                  <th class="r">Disk r / w</th>
                  <th>MCP</th>
                  <th>Doing now</th>
                </tr>
              </thead>
              <tbody id="sessions"></tbody>
            </table>
          </div>
        </div>
      </section>
    </div>
    <script type="module" src="app.js"></script>
  </body>
</html>
